[package]
name = "terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[features]
test-support = [
    "collections/test-support",
    "gpui/test-support",
    "settings/test-support",
]

[lints]
workspace = true

[lib]
path = "src/terminal.rs"
doctest = false

# `src/bin/kitty_probe.rs` is a test-only helper binary (auto-discovered by
# Cargo's default `src/bin/*.rs` convention, no explicit [[bin]] needed) —
# see that file's doc comment for why it has to be a REAL separate process.

[dependencies]
async-channel.workspace = true
alacritty_terminal.workspace = true
anyhow.workspace = true
assets.workspace = true
base64.workspace = true
collections.workspace = true
cpal.workspace = true
futures.workspace = true
futures-lite.workspace = true
gpui.workspace = true
image.workspace = true
itertools.workspace = true
libc.workspace = true
log.workspace = true
paths.workspace = true
regex.workspace = true
release_channel.workspace = true
schemars.workspace = true
serde.workspace = true
settings.workspace = true
smallvec.workspace = true
symphonia.workspace = true
sysinfo.workspace = true
task.workspace = true
theme.workspace = true
theme_settings.workspace = true
thiserror.workspace = true
url.workspace = true
util.workspace = true
urlencoding.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
som_srv.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
# Direct dependency (not just transitive through ffmpeg-next) — the
# hwaccel/hw_device_ctx API surface has no safe wrapper in ffmpeg-next
# at all (confirmed via grep of its source), so setting up D3D11VA
# hardware decode needs raw FFI against ffmpeg-sys-next's own bindgen-
# generated bindings (see rich_content_video_player.rs's hwaccel setup
# for the concrete usage).
ffmpeg-sys-next = { version = "9", default-features = false }

[dev-dependencies]
dirs.workspace = true
gpui = { workspace = true, features = ["test-support"] }
rand.workspace = true
settings = { workspace = true, features = ["test-support"] }
util_macros.workspace = true
