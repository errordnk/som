# The client side of Som's rich-content protocol (SRP), shared by Som's own
# crates (`somsrv`, `terminal`, `somsrp`) and by external clients (farsh,
# yazi). Deliberately free of every Zed/Som-internal crate: an external
# client takes it as a git dependency pinned to a rev, and gets only serde,
# anyhow, log and the OS bindings.
[package]
name = "srp_client"
version = "0.8.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = "1.0.86"
log = "0.4.16"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
chardetng = "0.1"
encoding_rs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
