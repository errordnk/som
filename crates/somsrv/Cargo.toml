# NOTE: keep this in lockstep with crates/zed/Cargo.toml's own `version` —
# HandshakeInfo::current() (protocol.rs) reads THIS crate's own
# CARGO_PKG_VERSION and treats it as Som's version for the whole
# deploy-vs-not-deploy decision (see project_som_tmux memory): somsrv
# always gets redeployed whenever Som's version changes, even if nothing in
# this crate itself changed, specifically so this number always means "Som
# build X" rather than "somsrv crate revision Y".
[package]
name = "somsrv"
version = "0.7.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "somsrv"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "somsrv"
path = "src/main.rs"
doctest = false

# The stand-in for `ssh` of the tests of remote tabs (`somsrv::testing`).
[[bin]]
name = "fakessh"
path = "src/bin/fakessh.rs"
doctest = false
required-features = ["test-support"]

[features]
# `somsrv::testing`: for the tests of other crates that run the real binaries.
test-support = []

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
alacritty_terminal.workspace = true
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
bincode.workspace = true
futures.workspace = true
hex.workspace = true
hmac = "0.12"
http.workspace = true
log.workspace = true
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
paths.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
sha2.workspace = true
smol.workspace = true
sysinfo.workspace = true
ureq = { workspace = true, features = ["socks-proxy"] }
uuid.workspace = true
zstd.workspace = true
zlog.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["term"] }
