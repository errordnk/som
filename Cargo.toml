    "crates/clock",
    "crates/collections",
    "crates/db",
    "crates/fs",
    "crates/gpui",
    "crates/gpui_shared_string",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_tokio",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/http_client_tls",
    "crates/markdown",
    "crates/menu",
    "crates/migrator",
    "crates/paths",
    "crates/platform_title_bar",
    "crates/project",
    "crates/release_channel",
    "crates/reqwest_client",
    "crates/rope",
    "crates/session",
    "crates/settings",
    "crates/settings_content",
    "crates/settings_json",
    "crates/settings_macros",
    "crates/sqlez",
    "crates/sqlez_macros",
    "crates/sum_tree",
    "crates/syntax_theme",
    "crates/terminal",
    "crates/terminal_view",
    "crates/text",
    "crates/theme",
    "crates/theme_settings",
    "crates/title_bar",
    "crates/ui",
    "crates/ui_macros",
    "crates/ui_prompt",
    "crates/util",
    "crates/util_macros",
    "crates/watch",
    "crates/workspace",
    "crates/worktree",
    "crates/zed",
    "crates/zed_actions",
    "crates/windows_resources",
    "crates/zed_env_vars",
    "crates/zlog",
    "crates/zlog_settings",
    "crates/ztracing",
]
default-members = ["crates/zed"]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#

assets = { path = "crates/assets" }
